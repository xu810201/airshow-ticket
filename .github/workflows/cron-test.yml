name: cron-test

# 临时诊断用：只做一件事——验证 GitHub 的 schedule 触发器在这个仓库上到底会不会响。
# 主工作流 monitor.yml 用的是 */10，这里用 */5 做对照。
# 确认结论后可以直接删掉这个文件。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 报告触发时间
        run: |
          echo "schedule 触发器工作正常"
          echo "UTC 时间：$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "北京时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "触发事件：${{ github.event_name }}"
