name: 珠海航展门票监控

# 每 10 分钟检查一次官网。GitHub 的 cron 用的是 UTC 时间，
# 这里只关心“间隔”，所以写 */10 就行，与北京时间无关。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: '只发一条测试推送到手机，不检查页面'
        type: boolean
        default: false

# 避免上一轮还没跑完又启动下一轮
concurrency:
  group: airshow-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 状态文件记录“已经看过的公告和句子”，缓存起来才能跨轮次去重，
      # 否则每 10 分钟都会把同样的内容当成新消息重推一遍。
      - name: 恢复监控状态
        uses: actions/cache@v6
        with:
          path: state
          key: airshow-state-${{ github.run_id }}
          restore-keys: |
            airshow-state-

      - name: 运行监控
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_WEBHOOK: ${{ secrets.CUSTOM_WEBHOOK }}
        run: |
          if [ "${{ inputs.test_push }}" = "true" ]; then
            echo ">>> 测试推送模式"
            python3 monitor.py --test-push
          else
            python3 monitor.py --once
          fi
